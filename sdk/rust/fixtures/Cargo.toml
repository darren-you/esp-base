# 测试用的夹具应用：故意触发各种故障的，把宿主接口逐个走一遍的（io，host 测试），在设备上操作引脚的（pins）。构建产物由 build_fixtures.sh 拷到 firmware/tests/apps/。
[package]
name = "fixtures"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
esp-base-app = { path = "../esp-base-app" }

[[example]]
name = "spin"
crate-type = ["cdylib"]

[[example]]
name = "trap"
crate-type = ["cdylib"]

[[example]]
name = "init_fail"
crate-type = ["cdylib"]

[[example]]
name = "bad_pointer"
crate-type = ["cdylib"]

[[example]]
name = "unknown_import"
crate-type = ["cdylib"]

[[example]]
name = "no_event"
crate-type = ["cdylib"]

[[example]]
name = "deep"
crate-type = ["cdylib"]

[[example]]
name = "trial_fault"
crate-type = ["cdylib"]

[[example]]
name = "io"
crate-type = ["cdylib"]

[[example]]
name = "pins"
crate-type = ["cdylib"]
