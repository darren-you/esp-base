[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
esp-base-app = { path = "../../esp-base-app" }

# 应用清单：内存上限（运行时内存池）和操作数栈，字节。名称和版本取自上面的 [package]。
# 这个样例在设备上用掉 7,296 字节的内存池（.wasm 1,303 字节、线性内存 4,176 字节，其余是运行时的开销）。
[package.metadata.esp-base]
memory = 10240
stack = 2048
